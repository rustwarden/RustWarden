[package]
name = "rustwarden"
version = "1.24.0"
edition = "2024"

[workspace]
members = [".", "plugin-sdk", "plugins/example-hello", "plugins/discord", "plugins/slack", "plugins/pushbullet", "plugins/ntfy", "plugins/gotify", "plugins/webhook", "plugins/ping", "plugins/ha", "plugins/virustotal", "plugins/prometheus", "plugins/upnp", "plugins/cloudflare", "plugins/opnsense", "plugins/speedtest", "plugins/thinkbroadband", "plugins/shodan", "plugins/abuseipdb"]
# Plain `cargo build` at the root builds RustWarden only; plugins are built with `-p <name> --target wasm32-wasip1`.
default-members = ["."]

[dependencies]
plugin-sdk = { path = "plugin-sdk" }
earcutr = "0.5.0"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow"] }

egui = "0.37.0"
arboard = { version = "3.7.0", default-features = false }
maxminddb = "0.32.0"
png = "0.18.1"
raw-window-handle = "0.6"
rusqlite = { version = "0.41.0", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tao = "0.37.2"
toml = "1.1.8"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_Console", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement_WindowsFirewall", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Etw", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Services", "Win32_NetworkManagement_NetManagement", "Win32_System_LibraryLoader", "Win32_Globalization", "Win32_NetworkManagement_Dns", "Win32_System_EventLog", "Win32_System_Time", "Win32_Networking_NetworkListManager", "Win32_System_Power", "Win32_System_ApplicationInstallationAndServicing", "Win32_Security_Authorization", "Win32_Security_Cryptography_Catalog", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_System_Environment", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Media_Control", "Foundation_Collections"] }
wry = "0.57.1"
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "cranelift", "wat"] }

[profile.dev]
opt-level = 1

# Keep dependencies fast in debug builds (map tessellation, egui).
[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
png = "0.18.1"
serde_json = "1"

# The About picture's force layout runs in build.rs; unoptimised it takes minutes.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
