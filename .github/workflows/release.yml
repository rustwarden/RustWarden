name: Release

# Nightly: builds and publishes a release only when there are commits since the last release tag.
# Run it by hand (Actions > Release > Run workflow) for the first release.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide and write notes
        id: plan
        run: bash .github/scripts/plan-release.sh

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.skip != 'true'

      - name: Test
        if: steps.plan.outputs.skip != 'true'
        run: cargo test --locked

      - name: Build (release, C runtime linked in)
        if: steps.plan.outputs.skip != 'true'
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked

      - name: Check the exe needs no extra DLLs
        if: steps.plan.outputs.skip != 'true'
        run: |
          bad="$(grep -aoiE '(vcruntime|msvcp|concrt|ucrtbase|api-ms-win-crt)[a-z0-9_.-]*\.dll' target/release/rustywire.exe | sort -u || true)"
          if [ -n "$bad" ]; then echo "::error::exe depends on redistributable DLLs: $bad"; exit 1; fi

      - name: Package
        if: steps.plan.outputs.skip != 'true'
        run: |
          cp target/release/rustywire.exe RustyWire.exe
          # The version is signed with the hash, so a server can't relabel an old build as a new release.
          tag="${{ steps.plan.outputs.tag }}"
          { sha256sum RustyWire.exe | awk '{print $1}'; echo "version=${tag#v}"; } > RustyWire.exe.sha256

      - name: Sign the checksum (ECDSA P-256; the app refuses updates without a valid signature)
        if: steps.plan.outputs.skip != 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::repo secret UPDATE_SIGNING_KEY is not set"; exit 1; fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out RustyWire.exe.sha256.sig RustyWire.exe.sha256
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Publish release
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" RustyWire.exe RustyWire.exe.sha256 RustyWire.exe.sha256.sig \
            --title "RustWarden ${{ steps.plan.outputs.version }}" \
            --notes-file notes.md --target "$GITHUB_SHA" --latest
